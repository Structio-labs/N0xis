[[claim]]
id = "decomp.condition-after-arithmetic"
layer = "the decompiled body"
says = "A condition after inc, dec, add, neg or test reads the flags the processor reads: signed where the jump is signed, at the operation's width."
oracle = "the processor, every boundary value"
test = "every_condition_after_arithmetic_answers_as_the_processor_does"
status = "verified"
measured = "2026-11-13, f982917 (on main as bc901d4)."

[[claim]]
id = "noreturn.traps"
layer = "control flow"
says = "ud2, hlt and int 0x29 do not return; a trap ends the function only where filler follows it."
oracle = "planted bytes; objdump on two release PE images (26 functions ending in int 0x29)"
test = [
  "a_trap_after_a_call_ends_the_block_and_stays_in_the_function",
  "a_trap_with_code_after_it_ends_the_block_and_not_the_function",
  "trapping_filler_after_a_call_is_outside_the_function",
]
status = "verified"
measured = "2026-11-13, claims-3; `hlt` is taken as a trap everywhere, which is wrong in ring-0 code (`sti; hlt; ret`)."

[[claim]]
id = "decomp.bodies-october-set"
layer = "the decompiled body"
says = "The 14 functions of the October formats set behave as their source on x86: ELF64 (executable, PIE, shared object), ELF32, PE32+ and PE32 from GCC, MinGW and the MSVC ABI."
oracle = "the processor: each printed body compiled beside the source function and run on the same inputs"
status = "measured-private"
measured = "2026-11-14, bc901d4, 8 x86 images x 14 functions, execution verdicts only on both sides: right 49 -> 76, wrong 36 -> 11, not settled (did not compile, could not map the image, or says unknown) 27 -> 25. The harness, calibrated by planting one change in each body it called right: caught 28 of 28 flipped comparisons, 62 of 63 additions made subtractions, 65 of 75 constants made one larger; the misses are a division by a constant through a multiply (msg) and two others, where the inputs never reach the values that differ. An independent review re-ran every recorded right body on about ten times more inputs, with garbage in the upper halves of 32-bit register arguments: all stay right. 6 of the 12 that say their return type is not known run right once it is filled in. The review's list of ways this harness can still lie is the condition for moving it into the repository. Closed there: a forwarded register argument dropped (caller1, 8 of 8 right), a loop testing a value defined later (strlen, wide_len), a signed shift printed unsigned (wide_mul), a 64-bit multiply printed 32-bit (msg), a void* subscript losing its width (wide_len). Still wrong: `decomp.ipa-register-allocation`. The harness is private for now; its i386 calls were corrected to hand `argN` its stack slot, without which 14 right bodies read as wrong. 2026-11-15, b6107c5 (bodies round 3 done), same harness and inputs: right 76 -> 82, wrong 11 -> 5 on the 8 x86 images; all printed bodies of the five big images and the behaviour sets unchanged or better (230/242, 117/123)."

[[claim]]
id = "decomp.ipa-register-allocation"
layer = "the decompiled body"
says = "GCC's interprocedural register allocation keeps a value in a caller-saved register across a call to a local function that does not clobber it; the pseudo-C reads it as a never-assigned name."
oracle = "the processor; the same source rebuilt with -fno-ipa-ra prints right"
status = "false"
measured = "2026-11-14, bc901d4: caller2, uses_farewell and run wrong on ELF64 executable and PIE and on MinGW x64, caller2 and uses_farewell on MinGW i386 (11 bodies). Bodies round 3 item 5 is on it. 2026-11-15, b6107c5: a register a LEAF local callee leaves alone is now carried across the call (non-leaf callees are refused as proof). Left wrong: run on the ELF64 executable, PIE and MinGW x64 (its callee is not a leaf), caller2 and uses_farewell on MinGW i386 (5 bodies, from 11)."

[[claim]]
id = "disasm.invalid-byte"
layer = "instruction decoding"
says = "disasm takes an invalid x86 byte as one byte, as the processor and objdump do, goes on past it, and says why where it answers fewer instructions than asked."
oracle = "objdump on the same bytes: a five-instruction fixture with one invalid byte (0x06 in 64-bit mode) and a truncated tail"
test = [
  "an_invalid_byte_is_one_byte_and_the_listing_goes_on_past_it",
  "a_listing_shorter_than_asked_says_why",
  "the_objdump_record_is_what_objdump_prints",
]
status = "verified"
measured = "2026-11-15: asked 10, answered 4 (mov, (bad) of one byte, mov, ret), as objdump, with a note that the bytes end inside an instruction at 0x40100c; before (0891678): 2, the second `invalid` of `06 b8`, no note. Open since 2026-10-20 (a stripped browser binary: 20 005 of 60 000 asked), not re-measured on it."

[[claim]]
