name: docs

# The documentation site is built from the same Markdown the repository already
# carries (README, CONCEPT, ROADMAP, docs/*), projected into mdBook pages by
# scripts/build_book.py. It therefore cannot drift from the repo the way a wiki
# does: every deploy regenerates every page from the canonical file.
on:
  push:
    branches: [main]
    # Only rebuild when something the book is made of actually changed.
    paths:
      - "**.md"
      - book.toml
      - scripts/build_book.py
      - .github/workflows/docs.yml
  workflow_dispatch:

# Pages deployments are not cancelled mid-flight: a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The prebuilt release, not `cargo install`: installing from source costs
      # minutes per run to produce an identical binary.
      - name: Install mdBook
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: python3 scripts/build_book.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
