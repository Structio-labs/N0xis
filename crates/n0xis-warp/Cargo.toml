[package]
name = "n0xis-warp"
description = "Clean-room implementation of WARP function/basic-block GUIDs (Vector 35's cross-tool signature identity): UUIDv5 over normalized code, dependency-free. The interoperability primitive n0xis shares with another tool's WARP format."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["warp", "reverse-engineering", "signature", "uuid", "decompiler"]
categories = ["development-tools", "algorithms"]

[dependencies]
# The core GUID math is dependency-free by design, exactly like n0xis-flirt: the
# SHA-1 and UUIDv5 it needs are implemented here. For that pure primitive with no
# supply-chain surface, depend with `default-features = false`.
#
# The `container` feature (reading `.warp` files) is on by default and adds only
# `flate2` — already in the workspace tree — for the zlib-compressed chunk payload.
flate2 = { version = "1", optional = true }

[features]
default = ["container"]
container = ["dep:flate2"]
