[package]
name = "n0xis-frontend"
description = "Shared frontend layer: source resolution, ISA selection and argument parsing that every frontend (CLI, MCP, HUD) goes through. One contract instead of a copy per frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
n0xis-contracts = { workspace = true }
n0xis-arch = { workspace = true }
# The registry's built-in capabilities run real passes — this crate sits
# *above* the core, never the other way round (scripts/check_boundary.sh
# enforces that direction).
n0xis-core = { workspace = true }
# `cfg_cached` — capabilities go through the pipeline's content-addressed
# artifact cache, exactly as the CLI's own handlers did.
n0xis-pipeline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Same target split as n0xis-cli / n0xis-mcp: live-process analysis has no
# meaningful "on" state off Windows, so it is keyed on the compile target
# rather than a synthetic feature. A frontend built here therefore sees exactly
# the source set it would have seen with its own hand-rolled copy.
[target.'cfg(windows)'.dependencies]
n0xis-sources = { workspace = true, features = ["static-pe", "live"] }
n0xis-project = { workspace = true, features = ["live"] }

[target.'cfg(not(windows))'.dependencies]
n0xis-sources = { workspace = true, features = ["static-pe"] }
n0xis-project = { workspace = true }
