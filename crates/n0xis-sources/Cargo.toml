[package]
name = "n0xis-sources"
description = "Source seam: MemorySource / SymbolProvider / ModuleProvider adapters. Phase 1 ships the OS-free Snapshot mock; LiveProcess/StaticPe land in Phase 2 behind features."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
n0xis-contracts = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
goblin = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[features]
default = []
# StaticPe (goblin) — file-backed PE source. goblin is cross-platform (not an OS
# dep), but gated anyway so the default build stays minimal.
static-pe = ["dep:goblin"]
# LiveProcess (Win32) — the only OS-linked adapter. Kept off by default so that
# `cargo test -p n0xis-core` links zero Windows APIs (the boundary exit test).
live = ["dep:windows-sys"]
