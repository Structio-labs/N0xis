[package]
name = "n0xis-hud"
description = "N0xHUD: a universal, config-driven cheat-menu overlay over the n0xis engine. Its own binary (n0xis-hud); shares n0xis-core/project/sources as libraries, exactly like the CLI and MCP frontends do. See docs/n0xhud/CONCEPT.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "n0xis-hud"
path = "src/main.rs"

# N0xHUD is a Windows-only frontend: it hooks the keyboard globally, drives a
# live process, and shows/hides its own HWND. Everything that implies is under
# the `cfg(windows)` table below, exactly as `n0xis-cli`/`n0xis-mcp` already do
# it. That split is not cosmetic — this crate used to request
# `n0xis-sources/live` *unconditionally*, and because the workspace resolves
# features across all members, that turned `live` (hence `windows-sys`) on for
# every consumer of `n0xis-sources` in a plain `cargo build --workspace`. On
# Linux the rlib still compiles (windows-link emits bare externs off Windows)
# and the failure only surfaces as undefined references to ReadProcessMemory /
# EnumWindows / Beep at *link* time. CI never caught it because the Linux job
# builds only `-p n0xis-cli -p n0xis-mcp`, never the workspace.
[dependencies]
n0xis-contracts = { workspace = true }
n0xis-arch = { workspace = true }
n0xis-core = { workspace = true }
n0xis-luajit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
n0xis-sources = { workspace = true, features = ["live"] }
n0xis-project = { workspace = true, features = ["live"] }

# Dynamic loader for interception.dll (the stratagem-macro key sender — some
# games reject synthetic SendInput; see src/interception.rs). Loaded at
# runtime from a `hud.toml`-configured path, never linked at build time, so
# the crate builds fine on a machine without the driver installed.
libloading = { workspace = true }

# Overlay window + rendering. eframe gives a transparent/undecorated/
# always-on-top viewport (winit) without hand-rolled DirectComposition code.
eframe = "0.29"
# .n0x/hud.toml config format.
toml = "0.8"

# This crate's own Win32 surface on top of the workspace's shared windows-sys
# dependency: the global low-level keyboard hook + window show/hide, and the
# activation beep (Beep lives under Diagnostics::Debug in windows-sys).
windows-sys = { workspace = true, features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_Debug",
] }
