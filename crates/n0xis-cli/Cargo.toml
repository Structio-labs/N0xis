[package]
name = "n0xis-cli"
description = "The n0xis CLI — thin clap frontend over the pipeline. Emits the ok/data/meta envelope. Binary: n0xis (kept invocable as n0x)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "n0xis"
path = "src/main.rs"

[dependencies]
n0xis-contracts = { workspace = true }
n0xis-arch = { workspace = true }
n0xis-core = { workspace = true }
n0xis-pipeline = { workspace = true }
# The shared frontend seam — source/arch resolution and argument parsing,
# identical to what n0xis-mcp uses. Cross-platform on its own (it carries the
# same cfg(windows) split inside).
n0xis-frontend = { workspace = true }
n0xis-bitsquid = { workspace = true }
n0xis-lua = { workspace = true }
n0xis-luajit = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Live-process (Win32/windows-sys) analysis has no meaningful "on" state on a
# non-Windows target, so it's keyed on the real compile target (cfg(windows)),
# not a synthetic feature flag — a plain Windows `cargo build --workspace
# --release` sees byte-identical enabled features to before this split.
[target.'cfg(windows)'.dependencies]
n0xis-sources = { workspace = true, features = ["static-pe", "live"] }
n0xis-project = { workspace = true, features = ["live"] }

[target.'cfg(not(windows))'.dependencies]
n0xis-sources = { workspace = true, features = ["static-pe"] }
n0xis-project = { workspace = true }
