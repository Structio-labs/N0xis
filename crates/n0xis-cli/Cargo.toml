[package]
name = "n0xis-cli"
description = "The n0xis CLI — thin clap frontend over the pipeline. Emits the ok/data/meta envelope. Binary: n0xis (kept invocable as n0x)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "n0xis"
path = "src/main.rs"

[dependencies]
n0xis-contracts = { workspace = true }
n0xis-arch = { workspace = true }
n0xis-sources = { workspace = true, features = ["static-pe", "live"] }
n0xis-core = { workspace = true }
n0xis-pipeline = { workspace = true }
n0xis-project = { workspace = true, features = ["live"] }
n0xis-bitsquid = { workspace = true }
n0xis-lua = { workspace = true }
n0xis-luajit = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
