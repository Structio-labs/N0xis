[package]
name = "n0xis-project"
description = "The .n0x/ analysis database: project discovery, config, init. Ported from the proven v0 layout; back-compat dir (.n0x) and shim (n0x.cmd) preserved."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
n0xis-contracts = { workspace = true }
n0xis-arch = { workspace = true }
n0xis-core = { workspace = true }
n0xis-sources = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }

[features]
default = []
# Gates `locator` (live-process `.n0xt` address resolution) so this crate's
# default build/tests stay OS-free, same reasoning as n0xis-sources itself.
live = ["dep:n0xis-sources", "n0xis-sources/live"]
