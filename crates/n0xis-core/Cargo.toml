[package]
name = "n0xis-core"
description = "Pure analysis: trait Pass, Ctx, and the pass pipeline over the Arch + source seams. No I/O, no OS — validated with the Snapshot mock."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
n0xis-contracts = { workspace = true }
n0xis-arch = { workspace = true }
n0xis-sources = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rustc-demangle = { workspace = true }
msvc-demangler = { workspace = true }
cpp_demangle = { workspace = true }

[features]
default = []
# Integration tests that spawn an external toolchain (a C/cross compiler,
# objdump/nm/readelf, qemu, wine) at runtime are gated behind this feature so
# they compile out of the default `cargo test` — CI runs on a moving runner
# whose toolchain version is not pinned, and those tests are LOCAL verification
# instruments, not CI gates. Off by default; enable it locally to run them.
oracle = []

[dev-dependencies]
serde_json = { workspace = true }
# Tests only: the real PE loader, to validate the NativeAOT reader against a
# on-disk image. Kept out of the library build so the core stays IO-free.
n0xis-sources = { workspace = true, features = ["static-pe"] }
