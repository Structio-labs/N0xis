# N0xis — reverse-engineering and live-memory toolkit (v1 rewrite).
# See CONCEPT.md §4 for the crate boundaries and why each seam exists.
[workspace]
resolver = "3"
members = ["crates/*"]
# The archived v0 binary is its own independent crate (kept buildable for the
# Phase 2 parity gate) — not a workspace member.
exclude = ["archive/n0x-cli-rs-v0"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0xis-re/n0xis"
rust-version = "1.90"

[workspace.dependencies]
# --- external (single source of truth for versions) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
iced-x86 = "1"
dirs = "6"
goblin = "0.10"
rustc-demangle = "0.1.28"
msvc-demangler = "0.11.0"
cpp_demangle = "0.5.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

# --- internal crates (path deps; the workspace is the graph in CONCEPT §4) ---
n0xis-contracts = { path = "crates/n0xis-contracts" }
n0xis-arch = { path = "crates/n0xis-arch" }
n0xis-sources = { path = "crates/n0xis-sources" }
n0xis-core = { path = "crates/n0xis-core" }
n0xis-project = { path = "crates/n0xis-project" }
n0xis-pipeline = { path = "crates/n0xis-pipeline" }

[profile.release]
lto = "thin"
codegen-units = 1
